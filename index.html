<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorist | Generador de Paletas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
        <div class="gradient-banner"></div>
        
        <div class="brand-container">
            <!-- Isotipo SVG Geométrico -->
            <svg width="42" height="42" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="16" cy="20" r="12" fill="#ff4b4b" style="mix-blend-mode: multiply;" opacity="0.85"/>
                <circle cx="26" cy="14" r="12" fill="#f9c74f" style="mix-blend-mode: multiply;" opacity="0.85"/>
                <circle cx="26" cy="26" r="12" fill="#9b5de5" style="mix-blend-mode: multiply;" opacity="0.85"/>
            </svg>
            <h1>Colorist</h1>
        </div>
        
        <p>Una herramienta intuitiva y de estética minimalista para potenciar el flujo creativo visual.</p>
    </header>

    <main>
        <!-- SECCIÓN DE CONTROLES -->
        <section class="controls">
            <label for="palette-size">Tamaño de la paleta:</label>
            <select id="palette-size">
                <option value="6">6 colores</option>
                <option value="8">8 colores</option>
                <option value="9">9 colores</option>
            </select>
            
            <button id="generate-btn">Generar paleta</button>
        </section>

        <!-- SECCIÓN DE LA PALETA -->
        <section id="palette-container" aria-live="polite">
            <!-- Aquí nuestro JavaScript inyectará dinámicamente cada color -->
        </section>
    </main>

    <!-- CONTENEDOR DE MICROFEEDBACK -->
    <div id="toast" class="hidden" role="alert" aria-hidden="true"></div>

    <!-- Vinculamos el script justo antes de cerrar el body -->
    <script src="app.js"></script>
</body>
</html>
